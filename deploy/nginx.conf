# Production reference: nginx in front of todo.txt-mcp.
#
# Install as /etc/nginx/conf.d/todo-txt-mcp.conf (included from the http
# context), then replace todo.example.com and the certificate paths.
#
# App assumptions (see docs/single-user-deployment.md):
#   HOST=0.0.0.0 (container) or 127.0.0.1 (native), port 3000
#   MCP_ALLOWED_HOSTS=todo.example.com
#   MCP_ALLOWED_ORIGINS=https://todo.example.com   # only for a browser client
#   MCP_AUTH_TOKEN_FILE=/run/secrets/mcp_auth_token  # 0600 / Docker secret
#   TRUST_PROXY=loopback                            # same-host native proxy
#
# If the app runs in Docker with a published 127.0.0.1:3000 port, the container
# usually sees the Docker bridge gateway (for example 172.17.0.1), not loopback.
# Set TRUST_PROXY to the actual proxy address/CIDR and confirm the client IP in
# the structured `msg:"request"` log line before exposing the service.
#
# `http2 on;` requires nginx 1.25.1+. On older versions use
# `listen 443 ssl http2;` instead.

# 60 requests/minute matches the app default MCP_RATE_LIMIT_PER_MIN. Keep a
# small burst for legitimate MCP clients. The zone lives in the http context,
# which is where conf.d files are included.
limit_req_zone $binary_remote_addr zone=todo_mcp:10m rate=60r/m;

server {
	listen 80;
	listen [::]:80;
	server_name todo.example.com;

	# Redirect to the exact public hostname, not $host, to avoid an open
	# redirect if another Host header reaches this server block.
	return 301 https://todo.example.com$request_uri;
}

server {
	listen 443 ssl;
	listen [::]:443 ssl;
	http2 on;
	server_name todo.example.com;

	ssl_certificate     /etc/letsencrypt/live/todo.example.com/fullchain.pem;
	ssl_certificate_key /etc/letsencrypt/live/todo.example.com/privkey.pem;
	ssl_protocols TLSv1.2 TLSv1.3;
	ssl_session_cache shared:SSL:10m;
	ssl_session_timeout 1d;
	ssl_session_tickets off;

	add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
	add_header X-Content-Type-Options nosniff always;
	add_header Referrer-Policy no-referrer always;
	server_tokens off;

	# The app already caps bodies at 64 KiB. This is the earlier proxy limit.
	client_max_body_size 64k;
	client_header_timeout 10s;
	client_body_timeout 15s;
	keepalive_timeout 30s;
	send_timeout 30s;

	# /readyz performs a full load + serialize of the todo list, so keep it off
	# the public listener. Probe it over loopback or an internal listener (for
	# example an orchestrator exec probe against 127.0.0.1:3000). Do not put the
	# MCP bearer token in a probe spec. /healthz stays reachable for liveness.
	# Match the whole prefix case-insensitively: Express also serves /readyz/
	# and /READYZ, and an exact `location = /readyz` would miss them.
	location ~* ^/readyz(/|$) {
		return 404;
	}

	# /metrics is OFF by default. The app returns 404 for /metrics when HOST is
	# non-loopback unless MCP_METRICS_ENABLED is set explicitly; deny it here so
	# exposure never depends on app configuration.
	location = /metrics {
		return 404;
	}

	# If you deliberately enable metrics, remove the location above and use:
	#
	# location = /metrics {
	# 	limit_req zone=todo_mcp burst=10 nodelay;
	# 	proxy_pass http://127.0.0.1:3000;
	# 	proxy_http_version 1.1;
	# 	proxy_set_header Host $host;
	# 	proxy_set_header X-Forwarded-For $remote_addr;
	# 	proxy_set_header X-Forwarded-Proto $scheme;
	# 	proxy_set_header Connection "";
	# }
	#
	# Prefer a separate high-entropy MCP_METRICS_TOKEN and scrape from a trusted
	# network or over the loopback interface.

	location / {
		limit_req zone=todo_mcp burst=20 nodelay;
		limit_req_status 429;

		proxy_pass http://127.0.0.1:3000;
		proxy_http_version 1.1;

		# Preserve the public Host header; MCP_ALLOWED_HOSTS validates it.
		proxy_set_header Host $host;
		# Replace, never append to, a client-supplied X-Forwarded-For. If nginx
		# is behind a CDN, configure real_ip_header first so $remote_addr is
		# the real client.
		proxy_set_header X-Forwarded-For $remote_addr;
		proxy_set_header X-Forwarded-Proto $scheme;
		proxy_set_header Connection "";

		proxy_connect_timeout 5s;
		proxy_send_timeout 30s;
		proxy_read_timeout 30s;
	}
}
