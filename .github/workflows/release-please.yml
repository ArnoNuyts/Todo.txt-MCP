name: Release Please

on:
  push:
    branches: ["main"]

permissions:
  contents: write
  pull-requests: write
  # Needed so the job can dispatch the Publish workflow after a release.
  actions: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        id: release
        with:
          config-file: release-please-config.json
      # Releases created with GITHUB_TOKEN do not emit events that start other
      # workflows, so the `release: published` trigger in publish.yml never
      # fires. Dispatch it explicitly on the new tag instead.
      - name: Publish the new release
        if: ${{ steps.release.outputs.release_created == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run publish.yml --ref "${{ steps.release.outputs.tag_name }}"
