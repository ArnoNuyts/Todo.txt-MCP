name: Publish

on:
  release:
    types: [published]
  # release-please creates its releases with GITHUB_TOKEN, whose `release`
  # events do not start workflows. The Release Please workflow dispatches this
  # workflow on the new tag so stable releases still reach npm.
  workflow_dispatch:
  # Every push to release/next publishes an automatic beta to npm's `next`
  # tag. prerelease-v* tags are a manual escape hatch for testing an arbitrary
  # commit. Neither creates a GitHub release or moves `latest`.
  push:
    branches:
      - release/next
    tags:
      - "prerelease-v*"

permissions:
  contents: read
  id-token: write

concurrency:
  group: npm-publish
  cancel-in-progress: false

jobs:
  npm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: npm
          registry-url: https://registry.npmjs.org
      - run: npm ci
      - name: Set test-build version
        if: startsWith(github.ref, 'refs/tags/prerelease-v') || github.ref == 'refs/heads/release/next'
        run: |
          if [[ "$GITHUB_REF" == refs/tags/prerelease-v* ]]; then
            version="${GITHUB_REF_NAME#prerelease-v}"
            case "$version" in
              *-alpha.*|*-beta.*|*-rc.*) ;;
              *)
                echo "::error::Tag must be prerelease-vX.Y.Z-alpha.N, -beta.N, or -rc.N."
                exit 1
                ;;
            esac
          else
            # Next patch + a unique beta number for this workflow run.
            version="$(node -e '
              const pkg = require("./package.json");
              const base = pkg.version.split("-")[0].split("+")[0];
              const [major, minor, patch] = base.split(".").map(Number);
              process.stdout.write(`${major}.${minor}.${patch + 1}-beta.${process.env.GITHUB_RUN_NUMBER}`);
            ')"
          fi
          npm version "$version" --no-git-tag-version
      - run: npm run typecheck
      - run: npm test
      - name: Publish to npm
        run: |
          version="$(node -p "require('./package.json').version")"
          if npm view "@arnoarnoarno/todo.txt-mcp@${version}" version >/dev/null 2>&1; then
            echo "@arnoarnoarno/todo.txt-mcp@${version} is already published; skipping."
            exit 0
          fi
          case "$version" in
            *-*) tag=next ;;
            *) tag=latest ;;
          esac
          npm publish --provenance --access public --tag "$tag"
