# Single-user deployment: token from a Docker secret, loopback-only publish.
#
# Before the first start, create the host secret (never commit it):
#   install -d -m 700 secrets
#   openssl rand -hex 32 > secrets/mcp_auth_token.txt
#   chmod 600 secrets/mcp_auth_token.txt
#
# Compose mounts ./secrets/mcp_auth_token.txt at /run/secrets/mcp_auth_token.
# The app reads it through MCP_AUTH_TOKEN_FILE and supports SIGHUP reload:
#   docker kill --signal=HUP "$(docker compose -f docker-compose.deploy.yml ps -q todo-txt-mcp)"
#
# See docs/single-user-deployment.md and SECURITY.md before exposing /mcp.

services:
  todo-txt-mcp:
    # Run the published npm package in the official Node image. No local
    # build or git checkout is needed. Pin TODOTXT_MCP_VERSION for
    # reproducible deployments.
    image: node:26-alpine
    # Install the pinned npm package into /tmp, then replace the shell with the
    # server so SIGTERM reaches it directly and shutdown stays graceful.
    command:
      - sh
      - -c
      - >-
        npm install --global --prefix /tmp/todo-txt-mcp
        @arnoarnoarno/todo.txt-mcp@${TODOTXT_MCP_VERSION:-3.4.0} 1>&2
        && exec /tmp/todo-txt-mcp/bin/todo.txt-mcp
    # npm writes its cache and logs to $HOME; /tmp is the writable tmpfs below.
    # The rest of the filesystem stays read-only.
    user: node
    working_dir: /tmp

    ports:
      # Bind to the loopback interface only; use a TLS reverse proxy to expose it.
      # Never publish 3000:3000 or 0.0.0.0:3000 on a public host.
      - "127.0.0.1:3000:3000"

    init: true
    restart: unless-stopped
    # The worst-case legal todo.txt needs ~320 MB RSS; 512m leaves headroom for
    # cgroup accounting and concurrent requests. See docs/memory-budget.md.
    mem_limit: 512m
    pids_limit: 256
    stop_grace_period: 15s
    read_only: true
    tmpfs:
      # npm needs a writable, executable directory for its cache and the
      # installed package; Docker mounts tmpfs noexec by default.
      - /tmp:mode=1777,exec
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:' + (process.env.PORT || 3000) + '/healthz').then((res) => { if (!res.ok) process.exit(1); }).catch(() => process.exit(1));"
      interval: 30s
      timeout: 5s
      retries: 3
      # Allow time for the npm package download on first start.
      start_period: 60s

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

    volumes:
      # Mount a directory, not a single file: atomic writes replace the file
      # with a rename inside this directory.
      - ./data:/data

    secrets:
      - mcp_auth_token

    environment:
      # Keep the V8 heap below the cgroup limit so a pathological file fails
      # with a restartable V8 OOM instead of an abrupt container kill. The cgroup
      # still enforces RSS; this flag is not a memory cap. See docs/memory-budget.md.
      - NODE_OPTIONS=--max-old-space-size=384
      # npm state lives in the writable /tmp tmpfs.
      - HOME=/tmp
      - NPM_CONFIG_AUDIT=false
      - NPM_CONFIG_CACHE=/tmp/npm-cache
      - NPM_CONFIG_FUND=false
      - NPM_CONFIG_IGNORE_SCRIPTS=true
      - NPM_CONFIG_UPDATE_NOTIFIER=false
      # Network security (see SECURITY.md)
      - HOST=0.0.0.0
      # Set the public hostname and browser origin in .env, for example:
      #   MCP_ALLOWED_HOSTS=todo.example.com
      #   MCP_ALLOWED_ORIGINS=https://todo.example.com
      - "MCP_ALLOWED_HOSTS=${MCP_ALLOWED_HOSTS:-localhost,127.0.0.1}"
      - "MCP_ALLOWED_ORIGINS=${MCP_ALLOWED_ORIGINS:-http://localhost:3000}"
      # Prefer the 0600 secret file over an environment token. The file takes
      # precedence over MCP_AUTH_TOKENS and MCP_AUTH_TOKEN.
      - MCP_AUTH_TOKEN_FILE=/run/secrets/mcp_auth_token
      # Trust only the real proxy hop. For a same-host native proxy use
      # "loopback". With Docker's published port the app usually sees the
      # Docker bridge gateway instead; set TRUST_PROXY to that address/CIDR and
      # confirm the client IP in the `msg:"request"` log line.
      - "TRUST_PROXY=${TRUST_PROXY:-loopback}"
      # Metrics are OFF by default. Enable only with a separate high-entropy
      # MCP_METRICS_TOKEN and an explicit proxy rule.
      - MCP_METRICS_ENABLED=0
      # Configuration
      - TODOTXT_MCP_BACKEND=local
      - TODOTXT_MCP_LOCAL_FILENAME=/data/todo.txt
      # - TODOTXT_MCP_BACKEND=webdav
      # - TODOTXT_MCP_WEBDAV_URL=https://dav.example.com
      # - TODOTXT_MCP_WEBDAV_USERNAME=user
      # - TODOTXT_MCP_WEBDAV_PASSWORD=pass

secrets:
  mcp_auth_token:
    file: ./secrets/mcp_auth_token.txt
