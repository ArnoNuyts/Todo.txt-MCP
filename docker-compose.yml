# Quick start / local use only.
#
# MCP_AUTH_TOKEN is passed in the environment, where it is visible to
# `docker inspect` and /proc/<pid>/environ. For a public host use
# docker-compose.deploy.yml, which reads MCP_AUTH_TOKEN_FILE from a 0600 Docker
# secret and adds the same log rotation.
services:
  todo-txt-mcp:
    build: .
    ports:
      # Bind to the loopback interface only; use a TLS reverse proxy to expose it.
      - "127.0.0.1:3000:3000"
    init: true
    restart: unless-stopped
    # The worst-case legal todo.txt needs ~320 MB RSS; 512m leaves headroom for
    # cgroup accounting and concurrent requests. See docs/memory-budget.md.
    mem_limit: 512m
    pids_limit: 256
    stop_grace_period: 15s
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:' + (process.env.PORT || 3000) + '/healthz').then((res) => { if (!res.ok) process.exit(1); }).catch(() => process.exit(1));"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    volumes:
      # Mount a directory, not a single file: atomic writes replace the file
      # with a rename inside this directory.
      - ./data:/data
    environment:
      # Keep the V8 heap below the cgroup limit so a pathological file fails
      # with a restartable V8 OOM instead of an abrupt container kill. The cgroup
      # still enforces RSS; this flag is not a memory cap. See docs/memory-budget.md.
      - NODE_OPTIONS=--max-old-space-size=384
      # Network security (see SECURITY.md)
      - HOST=0.0.0.0
      - MCP_ALLOWED_HOSTS=localhost,127.0.0.1
      - MCP_ALLOWED_ORIGINS=http://localhost:3000
      # Required unless you replace this line with MCP_AUTH_TOKENS or
      # MCP_AUTH_TOKEN_FILE. Compose refuses to start without it.
      # Local convenience only: the value is visible via `docker inspect`.
      # For a public host, switch to MCP_AUTH_TOKEN_FILE (see
      # docker-compose.deploy.yml) and generate a 256-bit token.
      - MCP_AUTH_TOKEN=${MCP_AUTH_TOKEN:?MCP_AUTH_TOKEN is required}
      # Metrics are disabled by default when HOST is non-loopback. Enable only
      # with a separate MCP_METRICS_TOKEN and a proxy rule that permits it.
      # - MCP_METRICS_ENABLED=0
      # Example overrides (uncomment to use)
      - TODOTXT_MCP_BACKEND=local
      - TODOTXT_MCP_LOCAL_FILENAME=/data/todo.txt
      # - TODOTXT_MCP_BACKEND=webdav
      # - TODOTXT_MCP_WEBDAV_URL=https://dav.example.com
      # - TODOTXT_MCP_WEBDAV_USERNAME=user
      # - TODOTXT_MCP_WEBDAV_PASSWORD=pass
